[tool.poetry]
name = "ytdlp-servustv"
version = "2024.10.05"
package-mode = false

[tool.poetry.dependencies]
python = "^3.9"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4"
pytest-subtests = "*"
pytest-xdist = "*"
ytdlp-plugins = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-length = 88
target_version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | cache
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "test -v --tb=line -W ignore::DeprecationWarning"
cache_dir = ".cache/pytest"

[tool.mypy]
python_version = "3.7"
cache_dir = ".cache/mypy"
namespace_packages = true
exclude = "build|venv"
ignore_missing_imports = true
